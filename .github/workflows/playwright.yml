name: Playwright Tests

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'   # Daily: core browsers only
    # - cron: '0 0 * * 6'     # Weekly Saturday: core + extended browsers (Mobile Edge & Safari)

jobs:
  # ─────────────────────────────────────────────────────────
  # CORE: Desktop Chromium + Mobile Chrome (runs on ALL triggers)
  # ─────────────────────────────────────────────────────────
  test-core:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - VSR
          - MotorcycleVINLookup
          - VehicleHistoryEU
          - VINNumberCA
        browser:
          - Desktop
          - MobileChrome
        shard:
          - 1/3
          - 2/3
          - 3/3

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Get Playwright Version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Mask Sensitive Secrets in CI Logs
      run: |
        echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
        echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
        echo "::add-mask::${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}"

    - name: Run Playwright tests
      id: playwright-run
      continue-on-error: true
      run: |
        if [ "${{ matrix.browser }}" = "Desktop" ]; then
          PLAYWRIGHT_PROJECT="${{ matrix.project }}"
        else
          PLAYWRIGHT_PROJECT="${{ matrix.project }}_${{ matrix.browser }}"
        fi
        npx playwright test --project=$PLAYWRIGHT_PROJECT --shard=${{ matrix.shard }} --reporter=blob
      env:
        CI: true
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Run AI Agentic Self-Healer (On Test Failure)
      if: steps.playwright-run.outcome == 'failure'
      timeout-minutes: 5
      run: |
        if [ "${{ matrix.browser }}" = "Desktop" ]; then
          PLAYWRIGHT_PROJECT="${{ matrix.project }}"
        else
          PLAYWRIGHT_PROJECT="${{ matrix.project }}_${{ matrix.browser }}"
        fi
        PLAYWRIGHT_PROJECT=$PLAYWRIGHT_PROJECT npm run heal:prod
      env:
        CI: true
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Auto-Commit & Push AI Healed Locators Back to Repo
      if: steps.playwright-run.outcome == 'failure'
      run: |
        git config user.name "AI-Healer[bot]"
        git config user.email "ai-healer@users.noreply.github.com"
        git add tasks/ utils/
        git commit -m "chore(ai-healer): auto-repair locators via Gemini AI" || echo "No changes to commit"
        git push || echo "Push skipped or branch protected"

    - name: Upload Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-blob-reports-${{ matrix.project }}-${{ matrix.browser }}-shard-${{ strategy.job-index }}
        path: blob-report/
        retention-days: 1

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-${{ matrix.project }}-${{ matrix.browser }}-shard-${{ strategy.job-index }}
        path: allure-results/
        retention-days: 1

