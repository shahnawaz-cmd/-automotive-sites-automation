name: Playwright Tests

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0-5'   # Daily Sun–Fri: core browsers only
    - cron: '0 0 * * 6'     # Weekly Saturday: core + extended browsers

jobs:
  # ─────────────────────────────────────────────────────────
  # CORE: Desktop Chromium + Mobile Chrome (runs on ALL triggers)
  # ─────────────────────────────────────────────────────────
  test-core:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - VSR
          - MotorcycleVINLookup
          - VehicleHistoryEU
          - VINNumberCA
        browser:
          - Desktop
          - MobileChrome

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Get Playwright Version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Mask Sensitive Secrets in CI Logs
      run: |
        echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
        echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
        echo "::add-mask::${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}"

    - name: Run Playwright tests
      id: playwright-run
      continue-on-error: true
      run: |
        if [ "${{ matrix.browser }}" = "Desktop" ]; then
          PLAYWRIGHT_PROJECT="${{ matrix.project }}"
        else
          PLAYWRIGHT_PROJECT="${{ matrix.project }}_${{ matrix.browser }}"
        fi
        npx playwright test --project=$PLAYWRIGHT_PROJECT --reporter=blob
      env:
        CI: true
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Run AI Agentic Self-Healer (On Test Failure)
      if: steps.playwright-run.outcome == 'failure'
      timeout-minutes: 5
      run: npm run heal:prod
      env:
        CI: true
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Auto-Commit & Push AI Healed Locators Back to Repo
      if: steps.playwright-run.outcome == 'failure'
      run: |
        git config user.name "AI-Healer[bot]"
        git config user.email "ai-healer@users.noreply.github.com"
        git add tasks/ utils/
        git commit -m "chore(ai-healer): auto-repair locators via Gemini AI" || echo "No changes to commit"
        git push || echo "Push skipped or branch protected"

    - name: Upload Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-blob-reports-${{ matrix.project }}-${{ matrix.browser }}
        path: blob-report/
        retention-days: 1

  # ─────────────────────────────────────────────────────────
  # EXTENDED: Mobile Edge + Mobile Safari (Saturday only)
  # ─────────────────────────────────────────────────────────
  test-extended:
    if: github.event.schedule == '0 0 * * 6'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - VSR
          - MotorcycleVINLookup
          - VehicleHistoryEU
          - VINNumberCA
        browser:
          - MobileEdge
          - MobileSafari

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Get Playwright Version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Mask Sensitive Secrets in CI Logs
      run: |
        echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
        echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
        echo "::add-mask::${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}"

    - name: Run Playwright tests
      id: playwright-run-extended
      continue-on-error: true
      run: |
        PLAYWRIGHT_PROJECT="${{ matrix.project }}_${{ matrix.browser }}"
        npx playwright test --project=$PLAYWRIGHT_PROJECT --reporter=blob
      env:
        CI: true
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Run AI Agentic Self-Healer (On Test Failure)
      if: steps.playwright-run-extended.outcome == 'failure'
      timeout-minutes: 5
      run: npm run heal:prod
      env:
        CI: true
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Auto-Commit & Push AI Healed Locators Back to Repo
      if: steps.playwright-run-extended.outcome == 'failure'
      run: |
        git config user.name "AI-Healer[bot]"
        git config user.email "ai-healer@users.noreply.github.com"
        git add tasks/ utils/
        git commit -m "chore(ai-healer): auto-repair locators via Gemini AI" || echo "No changes to commit"
        git push || echo "Push skipped or branch protected"

    - name: Upload Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-blob-reports-${{ matrix.project }}-${{ matrix.browser }}
        path: blob-report/
        retention-days: 1

  # ─────────────────────────────────────────────────────────
  # MERGE: Combine all blob reports into one HTML + JSON report
  # ─────────────────────────────────────────────────────────
  merge-reports:
    if: always()
    needs: [test-core, test-extended]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Get Playwright Version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Download all Blob Reports
      uses: actions/download-artifact@v4
      with:
        path: all-blobs
        pattern: all-blob-reports-*
        merge-multiple: true

    - name: Merge Playwright Reports
      run: |
        PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-report/results.json npx playwright merge-reports --reporter=html,json ./all-blobs
      env:
        CI: true

    - name: Automated GitHub Issue Manager (Create/Close Issues)
      if: always()
      run: node scripts/manage-issues.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_EVENT: ${{ github.event_name }}

    - name: Send Consolidated Slack Notification
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        sudo apt-get install -y jq

        # --- Extract accurate counts from Playwright stats ---
        PASSED_TESTS=$(jq '.stats.expected // 0' playwright-report/results.json || echo "0")
        FAILED_TESTS=$(jq '.stats.unexpected // 0' playwright-report/results.json || echo "0")
        FLAKY_TESTS=$(jq '.stats.flaky // 0' playwright-report/results.json || echo "0")
        SKIPPED_TESTS=$(jq '.stats.skipped // 0' playwright-report/results.json || echo "0")
        TOTAL_TESTS=$(( PASSED_TESTS + FAILED_TESTS + FLAKY_TESTS + SKIPPED_TESTS ))

        # --- Group Active Batches by Site and list browser suffixes in parentheses ---
        SITES_TESTED_BULLETS=$(jq -r '
          .config.projects | 
          map(
            .name as $n | 
            ($n | split("_")[0]) as $base | 
            ($n | split("_")[1] // "Desktop") as $browser |
            {base: $base, browser: $browser}
          ) | 
          group_by(.base) | 
          map("• " + .[0].base + " (" + (map(.browser) | join(", ")) + ")") | 
          join("\n")
        ' playwright-report/results.json || echo "N/A")

        # --- Exclude skipped cases from pass rate percentage ---
        ACTIVE_TESTS=$(( TOTAL_TESTS - SKIPPED_TESTS ))
        if [ "$ACTIVE_TESTS" -gt 0 ]; then
          PASS_RATE=$(( PASSED_TESTS * 100 / ACTIVE_TESTS ))
        else
          PASS_RATE=0
        fi

        # --- Enhancement 2: Accurate failed tests list with site/project names (up to 5) ---
        FAILED_DETAILS=$(jq -r '
          [.. | select(.specs? // empty) | .specs[]? |
            .title as $title |
            .tests[]? |
            select(.status == "unexpected" or (.results? and (.results[] | select(.status == "failed" or .status == "timedOut")))) |
            "• [" + (.projectName // "Unknown") + "] " + $title
          ] | unique | .[0:5] | join("\n")
        ' playwright-report/results.json 2>/dev/null || echo "")
        [ -n "$FAILED_DETAILS" ] && FAILED_SECTION="\n*❌ Failed Tests:*\n\`\`\`$FAILED_DETAILS\`\`\`" || FAILED_SECTION=""

        # --- Enhancement 3: Accurate failed sites count and names ---
        TOTAL_SITES=$(jq '[.config.projects[] | .name | split("_")[0]] | unique | length' playwright-report/results.json || echo "4")

        FAILING_SITES_NAMES=$(jq -r '
          [.. | select(.projectName? and (.status? == "unexpected" or (.results? and (.results[] | select(.status == "failed" or .status == "timedOut"))))) | .projectName | split("_")[0]] | unique | join(", ")
        ' playwright-report/results.json 2>/dev/null || echo "")

        FAILED_SITES=$(jq -r '
          [.. | select(.projectName? and (.status? == "unexpected" or (.results? and (.results[] | select(.status == "failed" or .status == "timedOut"))))) | .projectName | split("_")[0]] | unique | length
        ' playwright-report/results.json 2>/dev/null || echo "0")

        # --- Schedule type label ---
        if [ "${{ github.event.schedule }}" = "0 0 * * 6" ]; then
          SCHEDULE_LABEL="Weekly Full Cross-Browser"
        else
          SCHEDULE_LABEL="Daily Core"
        fi

        if [ "$FAILED_TESTS" -eq 0 ] && [ "$TOTAL_TESTS" -gt 0 ]; then
          ICON="✅"
          TITLE="PROD STABLE — All $TOTAL_SITES Sites Passing"
          COLOR="#36a64f"
        else
          ICON="🚨"
          if [ -n "$FAILING_SITES_NAMES" ]; then
            TITLE="PROD STABILITY — $FAILED_SITES/$TOTAL_SITES Sites Failing ($FAILING_SITES_NAMES)"
          else
            TITLE="PROD STABILITY — $FAILED_TESTS Test(s) Failing"
          fi
          COLOR="#ff0000"
        fi

        RUN_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
        PAYLOAD=$(cat <<EOF
        {
          "attachments": [
            {
              "color": "$COLOR",
              "blocks": [
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Daily Production Website Functional & Cross‑Browser QA Report*" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*$ICON $TITLE*" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*📊 Results:* ${PASS_RATE}% pass rate ($PASSED_TESTS/$ACTIVE_TESTS active)\n*Total Tests:* $TOTAL_TESTS\n*Passed:* $PASSED_TESTS\n*Failed:* $FAILED_TESTS\n*Flaky:* $FLAKY_TESTS\n*Skipped:* $SKIPPED_TESTS" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Active Batches:*\n$SITES_TESTED_BULLETS\n\n*Scope:* \`Global NextJS Sites - Functional E2E\`\n*Schedule:* \`$SCHEDULE_LABEL\`\n*Environment:* \`Production\`\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* \`${{ github.sha }}\`\n*Run time:* $RUN_TIME\n*Trigger:* ${{ github.event_name }}\n\n📥 *Links:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run> | <https://shahnawaz-cmd.github.io/-automotive-sites-automation/|View HTML Report>$FAILED_SECTION" }
                }
              ]
            }
          ]
        }
        EOF
        )
        curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" $SLACK_WEBHOOK_URL

    - name: Notify failures in alert channel
      if: always()
      env:
        SLACK_FAILURE_WEBHOOK_URL: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}
      run: |
        sudo apt-get install -y jq
        FAILED_TESTS=$(jq '.stats.unexpected // 0' playwright-report/results.json || echo "0")
        if [ "$FAILED_TESTS" -gt 0 ] && [ -n "$SLACK_FAILURE_WEBHOOK_URL" ]; then
          TOTAL_TESTS=$(jq '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' playwright-report/results.json || echo "0")
          ALERT_PAYLOAD='{"text": "🚨 *PROD ALERT:* Playwright E2E tests detected '"$FAILED_TESTS"' failure(s) out of '"$TOTAL_TESTS"' total tests. <@U09UE83AWGP>\n<https://shahnawaz-cmd.github.io/-automotive-sites-automation/|View HTML Failure Report>"}'
          curl -X POST -H 'Content-Type: application/json' --data "$ALERT_PAYLOAD" "$SLACK_FAILURE_WEBHOOK_URL"
        fi

    - name: Upload Final Consolidated Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy consolidated report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        keep_files: false
