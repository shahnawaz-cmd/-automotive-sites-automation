name: Playwright Tests

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - VSR
          - MotorcycleVINLookup
          - VehicleHistoryEU
          - VINNumberCA
        browser:
          - Desktop
          - MobileChrome

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
        if [ "${{ matrix.browser }}" = "MobileChrome" ]; then
          PLAYWRIGHT_PROJECT="${{ matrix.project }}_MobileChrome"
        else
          PLAYWRIGHT_PROJECT="${{ matrix.project }}"
        fi
        npx playwright test --project=$PLAYWRIGHT_PROJECT --reporter=blob || true
      env:
        CI: true

    - name: Upload Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-blob-reports-${{ matrix.project }}-${{ matrix.browser }}
        path: blob-report/
        retention-days: 1

  merge-reports:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Download all Blob Reports
      uses: actions/download-artifact@v4
      with:
        path: all-blobs
        pattern: all-blob-reports-*
        merge-multiple: true

    - name: Merge Playwright Reports
      run: |
        PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-report/results.json npx playwright merge-reports --reporter=html,json ./all-blobs
      env:
        CI: true

    - name: Send Consolidated Slack Notification
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        sudo apt-get install -y jq
        
        # Parse merged results.json
        TOTAL_TESTS=$(jq '[.. | .tests? | select(. != null) | .[]] | length' playwright-report/results.json || echo "0")
        FAILED_TESTS=$(jq '[.. | .status? | select(. == "failed")] | length' playwright-report/results.json || echo "0")
        FLAKY_TESTS=$(jq '[.. | .status? | select(. == "flaky")] | length' playwright-report/results.json || echo "0")
        SKIPPED_TESTS=$(jq '[.. | .status? | select(. == "skipped")] | length' playwright-report/results.json || echo "0")
        PASSED_TESTS=$(jq '[.. | .status? | select(. == "passed")] | length' playwright-report/results.json || echo "0")
        
        # Extract site names dynamically from the merged config
        SITES_TESTED=$(jq -r '.config.projects | map(.name) | join(", ")' playwright-report/results.json || echo "N/A")
        
        # Get names of up to 3 failed tests
        FAILED_NAMES=$(jq -r '[.. | select(.status? == "failed") | .title] | .[0:3] | join("\n")' playwright-report/results.json || echo "")
        [ -n "$FAILED_NAMES" ] && FAILED_SECTION="\n*Failed Tests:*\n\`\`\`$FAILED_NAMES\`\`\`" || FAILED_SECTION=""
        # Get names of up to 3 skipped tests
        # Skipped test details omitted – only count is shown
        SKIPPED_SECTION=""

        if [ "$FAILED_TESTS" -eq 0 ] && [ "$TOTAL_TESTS" -gt 0 ]; then
          ICON="✅"
          STATUS="Passed"
          COLOR="#36a64f"
        else
          ICON="🚨"
          STATUS="Failed"
          COLOR="#ff0000"
        fi
        
        # Construct Slack Payload
        RUN_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
        PAYLOAD=$(cat <<'EOF'
        {
          "attachments": [
            {
              "color": "$COLOR",
              "blocks": [
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Daily Production Website Functional & Cross-Browser QA Report*" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*$ICON $STATUS – $TOTAL_TESTS tests*" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Active Batches:* `$SITES_TESTED`
*Scope:* `auth-multiproperty-automation`
*Environment:* NextJS & WordPress Production
*Branch:* `${{ github.ref_name }}`
*Commit:* `${{ github.sha }}`
*Run time:* $RUN_TIME
*Trigger:* ${{ github.event_name }}$FAILED_SECTION" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Total Tests:*\n$TOTAL_TESTS" },
                    { "type": "mrkdwn", "text": "*Passed:*\n$PASSED_TESTS" },
                    { "type": "mrkdwn", "text": "*Failed:*\n$FAILED_TESTS" },
                    { "type": "mrkdwn", "text": "*Flaky:*\n$FLAKY_TESTS" },
                    { "type": "mrkdwn", "text": "*Skipped:*\n$SKIPPED_TESTS" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "View Workflow Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                    { "type": "button", "text": { "type": "plain_text", "text": "View HTML Report" }, "url": "https://shahnawaz-cmd.github.io/-automotive-sites-automation/" }
                  ]
                }
              ]
            }
          ]
        }
EOF
        )
        curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" $SLACK_WEBHOOK_URL

    - name: Notify failures in alert channel
      if: always() && [ "$FAILED_TESTS" -ne 0 ]
      env:
        SLACK_FAILURE_WEBHOOK_URL: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}
      run: |
        # Build a concise failure alert payload
        ALERT_PAYLOAD=$(cat <<EOF
        {
          "text": ":warning: Playwright failed ($FAILED_TESTS/$TOTAL_TESTS). <@U09UE83AWGP>"
        }
        EOF
        )
        curl -X POST -H 'Content-Type: application/json' --data "$ALERT_PAYLOAD" $SLACK_FAILURE_WEBHOOK_URL

    - name: Upload Final Consolidated Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy consolidated report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        keep_files: true
