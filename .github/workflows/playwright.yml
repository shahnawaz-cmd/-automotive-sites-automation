name: Playwright Tests

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
        npx playwright test --reporter=html,json || true
      env:
        CI: true
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

    - name: Send Slack Notification
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        sudo apt-get install -y jq
        
        # Parse results.json
        TOTAL_TESTS=$(jq '[.. | .tests? | select(. != null) | .[]] | length' playwright-report/results.json || echo "0")
        FAILED_TESTS=$(jq '[.. | .status? | select(. == "failed")] | length' playwright-report/results.json || echo "0")
        PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS))
        
        # Extract site names dynamically
        SITES_TESTED=$(jq -r '.config.projects | map(.name) | join(", ")' playwright-report/results.json || echo "N/A")
        
        # Get names of up to 3 failed tests
        FAILED_NAMES=$(jq -r '[.. | select(.status? == "failed") | .title] | .[0:3] | join("\n")' playwright-report/results.json || echo "")
        [ -n "$FAILED_NAMES" ] && FAILED_SECTION="\n*Failed Tests:*\n\`\`\`$FAILED_NAMES\`\`\`" || FAILED_SECTION=""

        if [ "$FAILED_TESTS" -eq 0 ]; then
          ICON="✅"
          STATUS="Passed"
          COLOR="#36a64f"
        else
          ICON="🚨"
          STATUS="Failed"
          COLOR="#ff0000"
        fi
        
        # Construct Slack Payload
        PAYLOAD=$(cat <<EOF
        {
          "attachments": [
            {
              "color": "$COLOR",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "$ICON Regression Test Result: $STATUS" }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Sites:* \`$SITES_TESTED\`\n*Scope:* \`auth-multiproperty-automation\`\n*Environment:* NextJS & WordPress Production\n*Branch:* \`${{ github.ref_name }}\`\n*Commit:* \`${{ github.sha }}\`\n*Trigger:* ${{ github.event_name }}$FAILED_SECTION"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Total Tests:*\n$TOTAL_TESTS" },
                    { "type": "mrkdwn", "text": "*Passed:*\n$PASSED_TESTS" },
                    { "type": "mrkdwn", "text": "*Failed:*\n$FAILED_TESTS" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View HTML Report" },
                      "url": "https://shahnawaz-cmd.github.io/-automotive-sites-automation/"
                    }
                  ]
                }
              ]
            }
          ]
        }
        EOF
        )
        curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" $SLACK_WEBHOOK_URL

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        keep_files: true
