name: Playwright Tests

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      site_filter:
        description: 'Select website to run (or "all" for all websites)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - VSR
          - MotorcycleVINLookup
          - VehicleHistoryEU
          - VINNumberCA
          - InstantVinReports
          - DetailedVehicleHistory
      browser_filter:
        description: 'Select browser target (or "all" for both Desktop & Mobile)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - Desktop
          - MobileChrome
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'   # Daily: core browsers only
    # - cron: '0 0 * * 6'     # Weekly Saturday: core + extended browsers (Mobile Edge & Safari)

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # MATRIX SETUP: Dynamic Sharding & Selective PR Smoke Execution
  # ─────────────────────────────────────────────────────────
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "⚡ Pull Request detected: Fast Smoke Suite (2 Jobs: VSR & IVR Desktop)"
            echo 'matrix={"project":["VSR","InstantVinReports"],"browser":["Desktop"],"shard":["1/1"]}' >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.site_filter || 'all' }}" != "all" ]; then
            SITE="${{ github.event.inputs.site_filter }}"
            BROWSER="${{ github.event.inputs.browser_filter || 'all' }}"
            echo "🎯 Manual Run for Site: $SITE, Browser: $BROWSER"
            if [ "$BROWSER" = "all" ]; then
              BROWSERS='["Desktop","MobileChrome"]'
            else
              BROWSERS='["'$BROWSER'"]'
            fi
            echo 'matrix={"project":["'$SITE'"],"browser":'$BROWSERS',"shard":["1/1"]}' >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.browser_filter || 'all' }}" != "all" ]; then
            BROWSER="${{ github.event.inputs.browser_filter }}"
            echo "🎯 Manual Run for all Sites on Browser: $BROWSER"
            echo 'matrix={"project":["VSR","MotorcycleVINLookup","VehicleHistoryEU","VINNumberCA","InstantVinReports","DetailedVehicleHistory"],"browser":["'$BROWSER'"],"shard":["1/2","2/2"]}' >> $GITHUB_OUTPUT
          else
            echo "🚀 Full Run: Comprehensive Matrix (24 Jobs: 6 Sites x 2 Browsers x 2 Shards)"
            echo 'matrix={"project":["VSR","MotorcycleVINLookup","VehicleHistoryEU","VINNumberCA","InstantVinReports","DetailedVehicleHistory"],"browser":["Desktop","MobileChrome"],"shard":["1/2","2/2"]}' >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────
  # CORE: Desktop Chromium + Mobile Chrome
  # ─────────────────────────────────────────────────────────
  test-core:
    needs: setup-matrix
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
    - name: Get Playwright Version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-chromium-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Mask Sensitive Secrets in CI Logs
      run: |
        echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
        echo "::add-mask::${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}"

    - name: Run Playwright tests
      id: playwright-run
      run: |
        if [ "${{ matrix.browser }}" = "Desktop" ]; then
          PLAYWRIGHT_PROJECT="${{ matrix.project }}"
        else
          PLAYWRIGHT_PROJECT="${{ matrix.project }}_${{ matrix.browser }}"
        fi
        node scripts/run-flow.js --project=$PLAYWRIGHT_PROJECT --shard=${{ matrix.shard }}
      env:
        CI: true

    - name: Upload Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-blob-reports-${{ matrix.project }}-${{ matrix.browser }}-shard-${{ strategy.job-index }}
        path: blob-report/
        retention-days: 1

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-${{ matrix.project }}-${{ matrix.browser }}-shard-${{ strategy.job-index }}
        path: allure-results/
        retention-days: 1

    - name: Send Instant Slack Failure Alert for ${{ matrix.project }} (${{ matrix.browser }})
      if: steps.playwright-run.outcome == 'failure'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref_name }}
        GITHUB_SHA_VAL: ${{ github.sha }}
        GITHUB_EVENT: ${{ github.event_name }}
        SITE_NAME: ${{ matrix.project }}
        BROWSER_NAME: ${{ matrix.browser }}
        SUITE_TYPE: 'Core Flow'
        RUN_STATUS: ${{ steps.playwright-run.outcome }}
      run: |
        node scripts/slack-notify.js --site-mode --failures-only

  # ─────────────────────────────────────────────────────────
  # EXTENDED: Mobile Edge + Mobile Safari (Commented out)
  # ─────────────────────────────────────────────────────────
  # test-extended:
  #   if: github.event.schedule == '0 0 * * 6'
  #   timeout-minutes: 60
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       project:
  #         - VSR
  #         - MotorcycleVINLookup
  #         - VehicleHistoryEU
  #         - VINNumberCA
  #       browser:
  #         - MobileEdge
  #         - MobileSafari
  #       shard:
  #         - 1/3
  #         - 2/3
  #         - 3/3
  #
  #   steps:
  #   - uses: actions/checkout@v4
  #   - uses: actions/setup-node@v4
  #     with:
  #       node-version: lts/*
  #       cache: 'npm'
  #   - name: Install dependencies
  #     run: npm ci
  #   - name: Get Playwright Version
  #     id: playwright-version
  #     run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
  #   - name: Cache Playwright Browsers
  #     id: playwright-cache
  #     uses: actions/cache@v4
  #     with:
  #       path: ~/.cache/ms-playwright
  #       key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}
  #   - name: Install Playwright Browsers
  #     run: npx playwright install --with-deps
  #     if: steps.playwright-cache.outputs.cache-hit != 'true'
  #
  #   - name: Mask Sensitive Secrets in CI Logs
  #     run: |
  #       echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
  #       echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
  #       echo "::add-mask::${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}"
  #
  #   - name: Run Playwright tests
  #     id: playwright-run-extended
  #     run: |
  #       PLAYWRIGHT_PROJECT="${{ matrix.project }}_${{ matrix.browser }}"
  #       node scripts/run-flow.js --project=$PLAYWRIGHT_PROJECT --shard=${{ matrix.shard }}
  #     env:
  #       CI: true
  #
  #   - name: Upload Blob Report
  #     uses: actions/upload-artifact@v4
  #     if: always()
  #     with:
  #       name: all-blob-reports-${{ matrix.project }}-${{ matrix.browser }}-shard-${{ strategy.job-index }}
  #       path: blob-report/
  #       retention-days: 1
  #
  # ─────────────────────────────────────────────────────────
  # STANDALONE: Independent Suites (Session IP Stickiness, Pricing Page & UI/UX Audit)
  # Completely independent: no detect-flow, no flow branching, no shard coupling
  # ─────────────────────────────────────────────────────────
  test-standalone:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
    - name: Get Playwright Version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-chromium-${{ env.PLAYWRIGHT_VERSION }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Run Independent Test Suites (Session IP, Pricing, UI/UX & DataFast)
      id: standalone-run
      run: |
        npx playwright test tests/session_ip_stickiness.spec.ts tests/pricing_page.spec.ts tests/ui_ux_verification.spec.ts tests/datafast_verification.spec.ts --project=VSR --project=InstantVinReports --project=VSR_MobileChrome --project=DetailedVehicleHistory --project=DetailedVehicleHistory_MobileChrome
      env:
        CI: true

    - name: Upload Standalone Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-blob-reports-standalone
        path: blob-report/
        retention-days: 1

    - name: Upload Standalone Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-standalone
        path: allure-results/
        retention-days: 1

    - name: Send Instant Slack Failure Alert for Standalone Audits
      if: steps.standalone-run.outcome == 'failure'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref_name }}
        GITHUB_SHA_VAL: ${{ github.sha }}
        GITHUB_EVENT: ${{ github.event_name }}
        SITE_NAME: 'Standalone Audits'
        BROWSER_NAME: 'Desktop/Mobile'
        SUITE_TYPE: 'Standalone Audits'
        RUN_STATUS: ${{ steps.standalone-run.outcome }}
      run: |
        node scripts/slack-notify.js --site-mode --failures-only

  # ─────────────────────────────────────────────────────────
  # MERGE: Combine all blob reports into one HTML + JSON report and generate Allure Report
  # ─────────────────────────────────────────────────────────
  merge-reports:
    if: always()
    needs: [test-core, test-standalone]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Setup Java Runtime for Allure
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download all Blob Reports
      uses: actions/download-artifact@v4
      with:
        path: all-blobs
        pattern: all-blob-reports-*
        merge-multiple: true

    - name: Merge Playwright Reports
      run: |
        npx playwright merge-reports --config=merge.config.js ./all-blobs
      env:
        CI: true

    - name: Download all Allure Results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: all-allure-results
        merge-multiple: true

    - name: Checkout gh-pages for History Preservation
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Build Allure Report with Historical Trends
      if: always()
      run: |
        # 1. Copy previous history from gh-pages if available
        if [ -d "gh-pages-dir/history" ]; then
          echo "Copying previous Allure history..."
          mkdir -p all-allure-results/history
          cp -rf gh-pages-dir/history/* all-allure-results/history/ || true
        fi

        # 2. Generate new Allure report
        npx allure generate all-allure-results --clean -o allure-report-out

        # 3. Create deploy folder
        mkdir -p gh-deploy
        cp -rf allure-report-out/* gh-deploy/

        # 4. Copy Playwright HTML Report into subfolder
        mkdir -p gh-deploy/playwright
        if [ -d "playwright-report" ]; then
          cp -rf playwright-report/* gh-deploy/playwright/
        fi

    - name: Automated GitHub Issue Manager (Create/Close Issues)
      if: always()
      continue-on-error: true
      run: node scripts/manage-issues.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_EVENT: ${{ github.event_name }}

    - name: Send Consolidated Slack QA Report
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref_name }}
        GITHUB_SHA_VAL: ${{ github.sha }}
        GITHUB_EVENT: ${{ github.event_name }}
        SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
      run: |
        node scripts/slack-notify.js

    - name: Notify failures in alert channel
      if: always()
      continue-on-error: true
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref_name }}
        GITHUB_SHA_VAL: ${{ github.sha }}
        GITHUB_EVENT: ${{ github.event_name }}
        SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
      run: |
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          node scripts/slack-notify.js --failures-only
        fi

    - name: Upload Final Consolidated Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Final Consolidated Allure Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report-out/
        retention-days: 30

    - name: Deploy consolidated reports to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-deploy
        keep_files: false

